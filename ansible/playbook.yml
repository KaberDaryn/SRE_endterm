---
# ============================================================
# SRE End-Term Project — Ansible Playbook
# Student: Kaber Daryn | Group: SE-2430
# Purpose: Install Docker, deploy microservices stack
# ============================================================

- name: Setup SRE Microservices Infrastructure
  hosts: all
  become: yes
  vars:
    project_dir: /opt/sre-microservices
    docker_compose_version: "2.24.0"

  tasks:

    # ─── STEP 1: System Update ───
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - python3-pip
          - unzip
        state: present

    # ─── STEP 2: Install Docker ───
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # ─── STEP 3: Install Docker Compose standalone ───
    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # ─── STEP 4: Copy project files ───
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    - name: Copy microservices project to server
      copy:
        src: ../
        dest: "{{ project_dir }}"
        mode: preserve

    # ─── STEP 5: Configure environment ───
    - name: Create .env file from template
      template:
        src: templates/env.j2
        dest: "{{ project_dir }}/.env"
        mode: '0600'

    # ─── STEP 6: Deploy monitoring stack ───
    - name: Validate docker-compose configuration
      command: docker compose config
      args:
        chdir: "{{ project_dir }}"
      register: compose_validate
      changed_when: false

    - name: Print compose validation result
      debug:
        msg: "Docker Compose config is VALID"
      when: compose_validate.rc == 0

    # ─── STEP 7: Start services ───
    - name: Pull Docker images
      command: docker compose pull
      args:
        chdir: "{{ project_dir }}"
      ignore_errors: yes

    - name: Build and start all services
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
      register: compose_up

    - name: Wait for services to be healthy
      pause:
        seconds: 30

    # ─── STEP 8: Health check verification ───
    - name: Check service health — User API
      uri:
        url: "http://localhost:5001/health"
        method: GET
        status_code: 200
      register: user_health
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check service health — Product API
      uri:
        url: "http://localhost:5002/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check service health — Order API
      uri:
        url: "http://localhost:5003/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check service health — Notification API
      uri:
        url: "http://localhost:5004/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check service health — Payment API
      uri:
        url: "http://localhost:5005/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check Prometheus is running
      uri:
        url: "http://localhost:9090/-/ready"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Check Grafana is running
      uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: Print deployment summary
      debug:
        msg:
          - "======================================"
          - "SRE Microservices Deployment Complete"
          - "======================================"
          - "Frontend:     http://{{ ansible_host }}:5000"
          - "User API:     http://{{ ansible_host }}:5001"
          - "Product API:  http://{{ ansible_host }}:5002"
          - "Order API:    http://{{ ansible_host }}:5003"
          - "Notification: http://{{ ansible_host }}:5004"
          - "Payment API:  http://{{ ansible_host }}:5005"
          - "Prometheus:   http://{{ ansible_host }}:9090"
          - "Grafana:      http://{{ ansible_host }}:3000"
          - "Nginx:        http://{{ ansible_host }}:8081"
