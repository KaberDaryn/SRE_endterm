# ─── Notification Service ───
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: sre-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
        - name: notification-api
          image: sre-notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: NOTIFICATION_DB_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-api
  namespace: sre-microservices
spec:
  selector:
    app: notification-api
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-db
  namespace: sre-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-db
  template:
    metadata:
      labels:
        app: notification-db
    spec:
      containers:
        - name: notification-db
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: "notifications"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudacademy"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: notif-db-pvc
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: notif-db-pvc
          persistentVolumeClaim:
            claimName: notification-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: sre-microservices
spec:
  selector:
    app: notification-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-db-pvc
  namespace: sre-microservices
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
